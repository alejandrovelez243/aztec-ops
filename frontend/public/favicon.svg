  <!-- Tab-sized cut of brand/mark.svg. Two cards, not three, and a heavier
       diagonal: at 16px the third card collapses into a smudge, so the mark
       drops it rather than shipping an illegible miniature of itself.
       Values are literal because a static asset cannot read CSS tokens; they
       are the cobalto ramp of DESIGN.md. -->
  <rect x="1" y="10" width="21" height="21" rx="6" fill="#8FA2EE"/>
  <rect x="10" y="1" width="21" height="21" rx="6" fill="#2545DE"/>
</svg>
